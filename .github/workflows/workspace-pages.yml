name: Publish workspace

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/workspace-pages.yml'
      - '.github/scripts/pages_artifact.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Preserve the published landing and replace only app/
        run: python3 .github/scripts/pages_artifact.py workspace
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 90
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}app/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
