name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/**'
      - '.github/workflows/workspace-pages.yml'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/pages_artifact.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # Site
      - run: npm ci
      - run: npm run build
      - name: Preserve the published workspace
        run: python3 .github/scripts/pages_artifact.py landing
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 90
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
